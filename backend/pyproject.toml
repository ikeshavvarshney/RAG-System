[project]
name = "multimodal-rag-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pymupdf>=1.28",
    "python-docx>=1.1",
    "pillow>=11.0",
    "pytesseract>=0.3",
    "tiktoken>=0.8",
    "python-multipart>=0.0.20",
    "google-genai>=1.0",
    "pypdf>=5.0",
    "langchain-text-splitters>=0.3",
    "langchain-google-genai>=2.0",
    "chromadb>=1.0",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]
# PaddleOCR (D-27 primary engine). Kept out of the base dependencies: it pulls
# ~70 packages and a large CPU wheel, and ingestion degrades to Tesseract
# without it. Install with: pip install -e ".[ocr]"
ocr = [
    "paddlepaddle>=3.3,<4",
    "paddleocr>=3.7,<4",
    # PP-StructureV3 (table structure) needs this extra; installed now so the
    # structure path can be turned on without a second dependency change.
    "paddlex[ocr]>=3.7,<3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true